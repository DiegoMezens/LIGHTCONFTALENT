name: Build EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Installer pkg
      run: npm install -g pkg

    - name: Installer dépendances
      run: npm install

    - name: Compiler exe
      run: pkg . --targets node18-win-x64 --output dist/TalentToolLight.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TalentToolLight
        path: dist/TalentToolLight.exe
